name: Offline checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: '${{ matrix.os }} / Python 3.12'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - name: Install pinned application and build tools
        run: python -m pip install ".[dev]"
      - name: Build wheel and source archive
        run: python -m build
      - name: Offline tests and package-content checks
        env:
          RADIO_LOTE_WHEEL: dist
        run: python -m unittest discover -s tests -v
      - name: Check installed wheel outside the checkout
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall',
                          '--no-deps', str(wheels[0].resolve())], check=True)
          with tempfile.TemporaryDirectory() as temporary:
              data = str(Path(temporary) / 'empty-data')
              env = os.environ.copy()
              env.pop('PYTHONPATH', None)
              for arguments in (
                  ['--help'], ['--version'],
                  ['--lang', 'en', '--dados', data, 'status'],
                  ['--dados', data, 'batch', 'list'],
                  ['--dados', data, 'doctor'],
              ):
                  subprocess.run([sys.executable, '-m', 'radio_lote', *arguments],
                                 cwd=temporary, env=env, check=True, timeout=30)
      - name: Retain checked distributions
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radio-lote-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
